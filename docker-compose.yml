services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentia}
      POSTGRES_DB: ${POSTGRES_DB:-dentia}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentia}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
