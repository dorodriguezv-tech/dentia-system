name: Release

# Fase "Publicacion en Hostinger" sec. 11: cada version se construye aqui al
# crear una etiqueta vX.Y.Z -- nadie construye imagenes de produccion en su
# propia computadora. Pruebas y auditoria primero (ci-test.sh); cualquier
# fallo detiene todo lo demas.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write # publicar en GHCR
  id-token: write # firma sin llaves con cosign (OIDC)

env:
  GHCR_NAMESPACE: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dentia
          POSTGRES_PASSWORD: dentia
          POSTGRES_DB: dentia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dentia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dentia:dentia@localhost:5432/dentia
      JWT_SECRET: ci-test-secret-no-es-real-nunca-se-usa-en-produccion
      AI_ENABLED: "true"
      AI_FAKE_MODE: "true" # e2e/ necesita esto -- ver playwright.config.ts
      VOICE_FAKE_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Crear la base de pruebas (ademas de la principal, que ya crea el servicio)
        run: |
          PGPASSWORD=dentia psql -h localhost -U dentia -d dentia -c "CREATE DATABASE dentia_test;"

      - name: Instalar dependencias del backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar dependencias de e2e y los navegadores de Playwright
        working-directory: e2e
        run: |
          npm ci
          npm run install-browsers

      - name: Activar el venv del backend para el resto del job
        run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Pruebas, calidad, auditoria y E2E (ci-test.sh)
        run: ./deploy/vps/scripts/ci-test.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Instalar cosign
        uses: sigstore/cosign-installer@v3

      - name: Construir, escanear, publicar y firmar las imagenes
        run: ./deploy/vps/scripts/ci-build-push.sh

      - name: Empaquetar deploy/vps/
        run: ./deploy/vps/scripts/ci-package.sh

      - name: Publicar el release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dentia-vps-*.tar.gz
            dist/SHA256SUMS
            dist/release.json
            dist/*.sbom.json
