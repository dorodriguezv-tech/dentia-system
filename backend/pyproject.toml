[project]
name = "dentia-system-backend"
version = "0.1.0"
description = "DentalCare - API clinica dental"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "app.modules.*.rules"
strict = true

[[tool.mypy.overrides]]
module = "app.modules.*.service"
strict = true

[[tool.mypy.overrides]]
module = "app.ai.rules"
strict = true

[[tool.mypy.overrides]]
module = "app.ai.service"
strict = true

[[tool.mypy.overrides]]
# reportlab no distribuye stubs ni py.typed (a diferencia de pillow/faker, que si).
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# faster-whisper tampoco distribuye stubs ni py.typed.
module = "faster_whisper.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# xhtml2pdf tampoco distribuye stubs ni py.typed.
module = "xhtml2pdf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
