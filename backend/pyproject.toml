[project]
name = "dentia-system-backend"
version = "0.1.0"
description = "DentalCare - API clinica dental"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Salida cruda de `alembic revision --autogenerate`: nunca paso por
# black/ruff. Son snapshots historicos ya aplicados -- se ignoran solo las
# reglas cosmeticas (orden de imports, largo de linea); el resto de reglas
# (F, B, SIM, UP) se mantiene activo por si hay un bug real.
"alembic/env.py" = ["E501", "I001"]
"alembic/versions/*.py" = ["E501", "I001"]
# Texto literal de los 24 formatos oficiales de docs/formatos (ver plan
# aprobado): son parrafos legales copiados tal cual, no codigo -- partirlos
# en varias lineas de 100 caracteres no mejora nada y arriesga alterar el
# texto. Generado por scratchpad/emit_default_templates.py, no a mano.
"app/modules/documents/default_templates.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "app.modules.*.rules"
strict = true

[[tool.mypy.overrides]]
module = "app.modules.*.service"
strict = true

[[tool.mypy.overrides]]
module = "app.ai.rules"
strict = true

[[tool.mypy.overrides]]
module = "app.ai.service"
strict = true

[[tool.mypy.overrides]]
# reportlab no distribuye stubs ni py.typed (a diferencia de pillow/faker, que si).
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# faster-whisper tampoco distribuye stubs ni py.typed.
module = "faster_whisper.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# xhtml2pdf tampoco distribuye stubs ni py.typed.
module = "xhtml2pdf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
